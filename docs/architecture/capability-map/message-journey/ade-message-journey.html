# Interfig Presentation Adaptation

The edge-routing algorithm in `flow-model.js` is adapted from
`hindsight-interfig/src/geometry.ts` in
[vectorize-io/hindsight](https://github.com/vectorize-io/hindsight/blob/9269b88417ed263e5a8350f2e416ca2b322756b1/hindsight-interfig/src/geometry.ts),
pinned to `9269b88417ed263e5a8350f2e416ca2b322756b1`.

The local renderer uses interfig's group/node/edge/step schema and presentation
ideas from `src/index.tsx`: sequential beats, cumulative content, content-sized
cards, moving packets, narration and independent tours. It is a small standalone
SVG/DOM adaptation, not a vendored React renderer or ADE runtime dependency.
Controls add manual stepping and stop at the end instead of cycling into another
tour. The focused view projects the same inventory layout to current endpoints;
the whole-architecture view retains all ownership frames and records.
The ADE presentation adds a card-aware Manhattan fallback for obstructed active
transfers; otherwise it retains the adapted upstream cubic routing.

No Hindsight product architecture or figure data is included. All ADE content is
from the source-backed local specification. This notice is distributed beside
the editable sources and embedded in both generated presentations.

nce is semantically sufficient."},{"edges":"generation-input"},{"edges":"generation-request","say":"CHAR-03 and CHAR-04 share generation: interpretation, conversational judgment and character expression are responsibilities, not emitted intermediate stages."},{"edges":"generation-response"},{"edges":"candidate-reply","show":{"candidate":[{"tag":"PENDING","text":"Illustrative candidate text; not yet delivered"}]},"say":"A model response becomes a candidate reply. Grounding, judgment and fidelity are assessment lenses, not three additional calls."},{"edges":"typed-review-input","say":"After generation, the typed reviewer receives the current user, up to eight prior user messages, active facts and entities. It does NOT receive the candidate reply."},{"edges":"review-request"},{"edges":"review-response","show":{"review":[{"tag":"PROPOSAL","text":"Operations or no change; not persisted"}]},"say":"The reviewer interprets factual meaning. ADE structurally prepares the proposal; a valid source binding is not semantic proof."},{"edges":"index-input"},{"edges":"fact-embedding-request"},{"edges":"fact-embedding-response","say":"This example has value-bearing operations, so their fact representations are prepared before finalization. A no-change/value-less review does not require a fact-embedding provider call."},{"edges":"proposed-changes"},{"edges":"prepared-index"},{"edges":"pending-reply","say":"Runtime finalization locks and rechecks cancellation, lease, conversation version, memory generation and relevant source bindings before writing the success bundle."},{"edges":["commit-facts","commit-index","commit-dialogue","commit-run"],"show":{"commit":[{"tag":"ATOMIC","text":"Assistant + permitted state + terminal success"}],"dialogue":[{"tag":"COMMITTED","text":"User and assistant with run outcome"}],"runs":[{"tag":"SUCCEEDED","text":"Events + released lease"}]},"say":"One success transaction makes permitted facts, representations, assistant text and terminal metadata visible together. No new summary was prepared in this example. Grouped arrows are not parallel execution."},{"edges":"committed-outcome"},{"edges":"refresh-ui","say":"Events and status polling prompt the UI to reload persisted session state. The candidate is not streamed directly to the user by this path."},{"edges":"lineage-state"},{"edges":"activity-state","say":"The UI presents the reply, committed lineage and retained activity metadata. Activity can arrive during the run too; it is not a complete packet trace or hidden reasoning."}]},{"label":"2 - Compaction (conditional)","caption":"Implemented branch inside the attempt, BEFORE generation. Show only when a compaction plan is eligible under the bound policy; this is not a post-reply background worker.","flow":[{"edges":"compact-input","say":"Local context pressure can produce a plan over older messages and the previous summary. Natural B bypasses this branch; A/A0 have additional fit conditions."},{"edges":"compaction-request"},{"edges":"compaction-response","show":{"compact":[{"tag":"PREPARED","text":"Source-linked summary proposal"}]},"say":"The model creates working summary content, not independently authoritative facts."},{"edges":"summary-context","say":"The attempt uses the prepared summary while constructing generation context. This does not persist the summary yet."},{"light":["behavior","review","embedding"],"say":"Generation, review and any required embeddings proceed as in tab 1. This focused branch omits those repeated beats, not those runtime steps."},{"edges":"pending-summary"},{"edges":["commit-facts","commit-index","commit-dialogue","commit-summary","commit-run"],"say":"On a successful value-bearing-review example, the summary joins the same assistant/fact/index/run transaction. On failure, no new summary from this attempt is committed."}]},{"label":"3 - Memory tool (conditional)","caption":"Implemented finite conversation loop, only if search_memory is enabled and the model calls it. Internal Memory acce         const label = nodes.get(edge.from).label, target = nodes.get(edge.to).label;
        return `${label} -> ${target}: ${edge.label}`;
      }).join(' | ') || 'No transfer in this step';
      position(state.playing ? 0 : 0.5);
      return {width: plan.w, height: plan.h};
    }

    function position(fraction) {
      const eased = fraction < 0.5 ? 2 * fraction * fraction : 1 - (-2 * fraction + 2) ** 2 / 2;
      const positions = [];
      for (const {packet, hop} of packets) {
        const curve = curves.get(hop.edge);
        if (!curve) continue;
        const point = model.pointAt(curve, hop.back ? 1 - eased : eased);
        packet.setAttribute('transform', `translate(${point.x} ${point.y})`);
        positions.push(point);
      }
      if (follow && positions.length && viewport.clientHeight > 0) {
        const center = positions.reduce((sum, point) => ({x: sum.x + point.x / positions.length, y: sum.y + point.y / positions.length}), {x: 0, y: 0});

<script>(function () {
  'use strict';
  const root = document.getElementById('ade-moving-message');
  const figure = JSON.parse(root.querySelector('[data-figure]').textContent);
  const steps = figure.props.steps, model = globalThis.AdeFlowModel;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  const state = {tour: 0, beat: 0, playing: false, whole: false, rate: 1, elapsed: 0};
  const view = globalThis.AdeFlowView.create(root, figure);
  const tour = root.querySelector('[data-tour]');
  const play = root.querySelector('[data-play]');
  const previous = root.querySelector('[data-previous]');
  const next = root.querySelector('[data-next]');
  const replay = root.querySelector('[data-replay]');
  const mode = root.querySelector('[data-whole]');
  const speed = root.querySelector('[data-speed]');
  const count = root.querySelector('[data-count]');
  const progress = root.querySelector('[data-progress]');
  const caption = root.querySelector('[data-caption]');
  const narration = root.querySelector('[data-narration]');
  let frame = 0, lastTime = null;
  steps.forEach((step, index) => {
    const option = document.createElement('option');
    option.value = String(index); option.textContent = step.label; tour.appendChild(option);
  });

  function restore(saved) {
    const selected = saved?.privateContent;
    if (!selected || !Number.isInteger(selected.tour) || !steps[selected.tour]) return;
    state.tour = selected.tour;
    state.beat = Number.isInteger(selected.beat)
      ? Math.max(0, Math.min(steps[state.tour].flow.length - 1, selected.beat)) : 0;
    state.whole = Boolean(selected.whole);
    state.playing = false; state.elapsed = 0;
  }
  function save() {
    if (!window.openai?.setWidgetState) return;

      modelContent: {tour: steps[state.tour].label, step: state.beat + 1},
      privateContent: {tour: state.tour, beat: state.beat, whole: state.whole},
    }).catch(() => {});
  }

  function paint() {
    const selected = steps[state.tour];
    tour.value = String(state.tour);
    caption.textContent = selected.caption;
    narration.textContent = model.narration(selected, state.beat);
    count.textContent = `Step ${state.beat + 1} of ${selected.flow.length}`;
    progress.setAttribute('aria-valuemax', selected.flow.length);
    progress.setAttribute('aria-valuenow', state.beat + 1);
    progress.firstElementChild.style.width = `${(state.beat + 1) / selected.flow.length * 100}%`;
    play.textContent = reduced.matches ? 'Motion reduced' : state.playing ? 'Pause' : 'Play';
    play.disabled = reduced.matches;
    play.setAttribute('aria-pressed', String(state.playing));
    mode.setAttribute('aria-pressed', String(state.whole));
    mode.textContent = state.whole ? 'Follow this step' : 'Whole architecture';

    next.disabled = state.beat === selected.flow.length - 1;

    root.dataset.beat = String(state.beat);
