<section id="ade-moving-message" aria-label="ADE message journey">
  <div class="journey-heading">
    <h2>Journey of a message</h2>
    <span class="text-small text-muted">Illustrative ADE flow, not a live trace</span>
  </div>
  <div class="journey-figure">
    <div class="journey-canvas">
      <button class="btn" type="button" data-fullscreen aria-label="Open chart full screen" hidden>Full screen</button>
      <div class="journey-viewport" data-viewport aria-label="Animated architecture diagram"></div>
    </div>
    <div class="journey-playback">
      <div class="journey-controls viz-controls">
        <button class="btn" type="button" data-play aria-pressed="false">Play</button>
        <div class="journey-tours" data-tours role="group" aria-label="Choose a flow"></div>
        <button class="btn" type="button" data-speed aria-label="Playback speed 1x">1x</button>
      </div>
      <output class="journey-narration" data-narration aria-live="polite"></output>
      <div class="journey-stepping viz-controls">
        <button class="btn btn-ghost" type="button" data-previous>Previous</button>
        <output class="tabular-nums text-small" data-count></output>
        <button class="btn btn-ghost" type="button" data-next>Next</button>
        <button class="btn btn-ghost" type="button" data-replay>Replay</button>
        <button class="btn btn-ghost" type="button" data-whole aria-pressed="true">Follow this step</button>
      </div>
      <div class="journey-progress" data-progress role="progressbar" aria-label="Tour step" aria-valuemin="1" aria-valuenow="1" aria-valuemax="1"><div></div></div>
    </div>
  </div>
  <details class="journey-details text-small">
    <summary>Flow conditions and module details</summary>
    <output class="journey-caption" data-caption></output>
    <output class="journey-connections" data-connections></output>
    <dl data-module-details></dl>
  </details>
  <div class="journey-foot text-small">
    <span>L1/L2/L3: ownership, not execution order. Cylinders: persisted records.</span>
    <span>Presentation adapted from Vectorize interfig (MIT).</span>
  </div>
  <script type="application/json" data-figure>__FIGURE__</script>
</section>
<style>__STYLE__</style>
<script>__MODEL__</script>
<script>__LAYOUT__</script>
<script>__VIEW__</script>
<script>__PLAYER__</script>
