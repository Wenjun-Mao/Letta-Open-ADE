[project]
name = "letta-open-ade-workspace"
version = "0.3.0"
description = "Development workspace for the Letta Open ADE services and workflows."
requires-python = ">=3.12,<3.13"
dependencies = [
    "ade-api",
    "ade-model-router",
    "model-catalog-contracts",
]

[tool.uv.sources]
ade-api = { workspace = true }
ade-model-router = { workspace = true }
model-catalog-contracts = { workspace = true }

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "services/ade-api",
    "services/model-router",
    "packages/model-catalog-contracts",
    "workflows",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.16.4",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = [
    ".",
    "services/ade-api/src",
    "services/model-router/src",
    "packages/model-catalog-contracts/src",
]
