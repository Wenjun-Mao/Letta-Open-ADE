[project]
name = "letta-open-ade"
version = "0.2.0"
description = "Letta Open ADE with a first-party OpenAI-compatible model router."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.135.2",
    "httpx>=0.28.1",
    "letta-client>=1.12.1,<2",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.2",
    "uvicorn>=0.42.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.16.4",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F"]
