name: letta-open-ade

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LETTA_PG_USER:-letta}
      POSTGRES_PASSWORD: ${LETTA_PG_PASSWORD:-letta}
      POSTGRES_DB: ${LETTA_PG_DB:-letta}
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LETTA_PG_USER:-letta} -d ${LETTA_PG_DB:-letta}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  model-router:
    build:
      context: .
      dockerfile: services/model-router/Dockerfile
    restart: unless-stopped
    env_file:
      - ${LETTA_ENV_FILE:-.env}
    environment:
      - ADE_REPOSITORY_ROOT=/app
    volumes:
      - ./config:/app/config:ro
      - ./content/model-catalog:/app/content/model-catalog:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # Use a Docker-resolvable alias; Linux containers do not reliably resolve mDNS.
      - "dgx-spark:${DGX_SPARK_HOST:-100.64.35.71}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 --noproxy '*' http://127.0.0.1:8010/v1/health > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 10s

  letta:
    image: ${LETTA_SERVER_IMAGE:-letta/letta:0.16.8}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      model-router:
        condition: service_healthy
    env_file:
      - ${LETTA_ENV_FILE:-.env}
    environment:
      LETTA_PG_URI: ${LETTA_PG_URI:-postgresql://${LETTA_PG_USER:-letta}:${LETTA_PG_PASSWORD:-letta}@${LETTA_DB_HOST:-postgres}:${LETTA_PG_INTERNAL_PORT:-5432}/${LETTA_PG_DB:-letta}}
      LETTA_REDIS_HOST: ${LETTA_REDIS_HOST:-redis}
      LETTA_REDIS_PORT: ${LETTA_REDIS_PORT:-6379}
      LETTA_DEBUG: ${LETTA_DEBUG:-False}
      PYTHONPATH: ${PYTHONPATH:-/app}
      NLTK_DATA: ${NLTK_DATA:-/root/nltk_data}
      LETTA_NLTK_STRICT_LOCAL: ${LETTA_NLTK_STRICT_LOCAL:-true}
      LETTA_NLTK_DOWNLOAD_TIMEOUT_SECONDS: ${LETTA_NLTK_DOWNLOAD_TIMEOUT_SECONDS:-5}
      OPENAI_API_BASE: ${LETTA_OPENAI_API_BASE:-http://model-router:8010/v1}
      OPENAI_BASE_URL: ${LETTA_OPENAI_API_BASE:-http://model-router:8010/v1}
      OPENAI_API_KEY: ${MODEL_ROUTER_API_KEY:-local-router-dev-key}
      # Prevent router-only machine config from registering a second Letta provider.
      LMSTUDIO_BASE_URL: ""
    volumes:
      - ./data/nltk_data:/root/nltk_data:ro
      - ./infra/letta/sitecustomize.py:/app/sitecustomize.py:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 --noproxy '*' http://127.0.0.1:8283/v1/health/ > /dev/null 2>&1"]
      interval: ${LETTA_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${LETTA_HEALTHCHECK_TIMEOUT:-10s}
      retries: ${LETTA_HEALTHCHECK_RETRIES:-30}
      start_period: ${LETTA_HEALTHCHECK_START_PERIOD:-180s}
  ade-api:
    build:
      context: .
      dockerfile: services/ade-api/Dockerfile
      args:
        ADE_SOURCE_REVISION: ${ADE_SOURCE_REVISION:-unknown}
        ADE_SOURCE_DIRTY: ${ADE_SOURCE_DIRTY:-true}
        ADE_SOURCE_FINGERPRINT: ${ADE_SOURCE_FINGERPRINT:-unknown}
    restart: unless-stopped
    env_file:
      - ${LETTA_ENV_FILE:-.env}
    environment:
      - ADE_REPOSITORY_ROOT=/app
      - LETTA_BASE_URL=http://letta:8283
      - ADE_API_MODEL_ROUTER_BASE_URL=http://model-router:8010
      - ADE_API_DATABASE_URL=postgresql+psycopg://${ADE_PG_APP_USER:-ade_app}:${ADE_PG_APP_PASSWORD:-ade}@postgres:5432/${ADE_PG_DB:-ade}
    volumes:
      - ./content:/app/content
      - ./config:/app/config:ro
      - ./data/runtime:/app/data/runtime
      - ./workflows/evals/agent_runtime_v3_acceptance/outputs:/app/workflows/evals/agent_runtime_v3_acceptance/outputs
    ports:
      - "${ADE_API_BIND_HOST:-127.0.0.1}:${ADE_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v2/health', timeout=5).read()"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 10s
    depends_on:
      model-router:
        condition: service_healthy
      letta:
        condition: service_healthy

  ade-runtime-migrate:
    build:
      context: .
      dockerfile: services/ade-api/Dockerfile
      args:
        ADE_SOURCE_REVISION: ${ADE_SOURCE_REVISION:-unknown}
        ADE_SOURCE_DIRTY: ${ADE_SOURCE_DIRTY:-true}
        ADE_SOURCE_FINGERPRINT: ${ADE_SOURCE_FINGERPRINT:-unknown}
    restart: "no"
    environment:
      - ADE_REPOSITORY_ROOT=/app
      - ADE_DATABASE_ADMIN_URL=postgresql://${LETTA_PG_USER:-letta}:${LETTA_PG_PASSWORD:-letta}@postgres:5432/postgres
      - ADE_DATABASE_MIGRATION_URL=postgresql+psycopg://${LETTA_PG_USER:-letta}:${LETTA_PG_PASSWORD:-letta}@postgres:5432/${ADE_PG_DB:-ade}
      - ADE_PG_DB=${ADE_PG_DB:-ade}
      - ADE_PG_OWNER_ROLE=${ADE_PG_OWNER_ROLE:-ade_owner}
      - ADE_PG_APP_USER=${ADE_PG_APP_USER:-ade_app}
      - ADE_PG_APP_PASSWORD=${ADE_PG_APP_PASSWORD:?Set ADE_PG_APP_PASSWORD in .env}
    command:
      - /bin/sh
      - -ec
      - >-
        python -m ade_api.features.agent_runtime_v3.bootstrap &&
        alembic -c services/ade-api/alembic.ini upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  ade-runtime-db-test:
    # The production lane migrates on every ordinary `docker compose up`.
    # Keep database integration tests explicitly operator-invoked.
    profiles: ["native-runtime-test"]
    build:
      context: .
      dockerfile: services/ade-api/Dockerfile
      target: test
      args:
        ADE_SOURCE_REVISION: ${ADE_SOURCE_REVISION:-unknown}
        ADE_SOURCE_DIRTY: ${ADE_SOURCE_DIRTY:-true}
        ADE_SOURCE_FINGERPRINT: ${ADE_SOURCE_FINGERPRINT:-unknown}
    restart: "no"
    environment:
      - ADE_REPOSITORY_ROOT=/app
      - ADE_TEST_DATABASE_URL=postgresql+psycopg://${ADE_PG_APP_USER:-ade_app}:${ADE_PG_APP_PASSWORD:?Set ADE_PG_APP_PASSWORD in .env}@postgres:5432/${ADE_PG_DB:-ade}
    command:
      - /opt/venv/bin/python
      - -m
      - pytest
      - services/ade-api/tests/agent_runtime_v3/persistence
      - workflows/evals/agent_runtime_v3_acceptance/tests/test_cleanup_postgres.py
      - -q
    depends_on:
      ade-runtime-migrate:
        condition: service_completed_successfully

  ade-native-api:
    build:
      context: .
      dockerfile: services/ade-api/Dockerfile
      args:
        ADE_SOURCE_REVISION: ${ADE_SOURCE_REVISION:-unknown}
        ADE_SOURCE_DIRTY: ${ADE_SOURCE_DIRTY:-true}
        ADE_SOURCE_FINGERPRINT: ${ADE_SOURCE_FINGERPRINT:-unknown}
    restart: unless-stopped
    environment:
      - ADE_REPOSITORY_ROOT=/app
      - ADE_API_AUTH_ENABLED=${ADE_API_AUTH_ENABLED:-true}
      - ADE_API_ADMIN_KEY=${ADE_API_ADMIN_KEY:?Set ADE_API_ADMIN_KEY in .env}
      - ADE_API_OPERATOR_KEY=${ADE_API_OPERATOR_KEY:-}
      - ADE_API_READER_KEY=${ADE_API_READER_KEY:-}
      - ADE_API_CORS_ORIGINS=${ADE_API_CORS_ORIGINS:-}
      - ADE_API_AGENT_RUNTIME_V3_ENABLED=true
      - ADE_API_AGENT_RUNTIME_V3_MODE=${ADE_API_AGENT_RUNTIME_V3_MODE:-release}
      - ADE_API_DATABASE_URL=postgresql+psycopg://${ADE_PG_APP_USER:-ade_app}:${ADE_PG_APP_PASSWORD:?Set ADE_PG_APP_PASSWORD in .env}@postgres:5432/${ADE_PG_DB:-ade}
      - ADE_API_MODEL_ROUTER_BASE_URL=http://model-router:8010
      - ADE_API_MODEL_ROUTER_API_KEY_ENV=${ADE_API_MODEL_ROUTER_API_KEY_ENV:-MODEL_ROUTER_API_KEY}
      - ADE_API_MODEL_ROUTER_API_KEY_SECRET=${ADE_API_MODEL_ROUTER_API_KEY_SECRET:-model-router-api-key}
      - MODEL_ROUTER_API_KEY=${MODEL_ROUTER_API_KEY:-local-router-dev-key}
      - ADE_API_AGENT_RUNTIME_V3_WORKER_ID=${ADE_API_AGENT_RUNTIME_V3_WORKER_ID:-ade-runtime-worker}
      - ADE_API_AGENT_RUNTIME_V3_WORKER_HEARTBEAT_SECONDS=${ADE_API_AGENT_RUNTIME_V3_WORKER_HEARTBEAT_SECONDS:-5}
      - ADE_API_AGENT_RUNTIME_V3_WORKER_STALE_SECONDS=${ADE_API_AGENT_RUNTIME_V3_WORKER_STALE_SECONDS:-15}
      - AGENT_RUNTIME_V3_ACCEPTANCE_API_BASE_URL=http://ade-native-api:8000
    volumes:
      - ./workflows/evals/agent_runtime_v3_acceptance/outputs:/app/workflows/evals/agent_runtime_v3_acceptance/outputs
    ports:
      - "${ADE_NATIVE_API_BIND_HOST:-127.0.0.1}:${ADE_NATIVE_API_PORT:-8002}:8000"
    command: ["/opt/venv/bin/uvicorn", "ade_api.native_main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import os, urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/api/v3/worker-health', headers={'Authorization': 'Bearer ' + os.environ['ADE_API_ADMIN_KEY']}); urllib.request.urlopen(request, timeout=5).read()"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 10s
    depends_on:
      ade-runtime-migrate:
        condition: service_completed_successfully
      ade-runtime-worker:
        condition: service_started
      model-router:
        condition: service_healthy

  ade-runtime-worker:
    build:
      context: .
      dockerfile: services/ade-api/Dockerfile
      args:
        ADE_SOURCE_REVISION: ${ADE_SOURCE_REVISION:-unknown}
        ADE_SOURCE_DIRTY: ${ADE_SOURCE_DIRTY:-true}
        ADE_SOURCE_FINGERPRINT: ${ADE_SOURCE_FINGERPRINT:-unknown}
    restart: unless-stopped
    stop_grace_period: ${ADE_API_AGENT_RUNTIME_V3_STOP_GRACE_PERIOD:-650s}
    environment:
      - ADE_REPOSITORY_ROOT=/app
      - ADE_API_AGENT_RUNTIME_V3_ENABLED=true
      - ADE_API_AGENT_RUNTIME_V3_MODE=${ADE_API_AGENT_RUNTIME_V3_MODE:-release}
      - ADE_API_DATABASE_URL=postgresql+psycopg://${ADE_PG_APP_USER:-ade_app}:${ADE_PG_APP_PASSWORD:?Set ADE_PG_APP_PASSWORD in .env}@postgres:5432/${ADE_PG_DB:-ade}
      - ADE_API_MODEL_ROUTER_BASE_URL=http://model-router:8010
      - MODEL_ROUTER_API_KEY=${MODEL_ROUTER_API_KEY:-local-router-dev-key}
      - ADE_API_AGENT_RUNTIME_V3_WORKER_ID=${ADE_API_AGENT_RUNTIME_V3_WORKER_ID:-ade-runtime-worker}
      - ADE_API_AGENT_RUNTIME_V3_WORKER_POLL_SECONDS=${ADE_API_AGENT_RUNTIME_V3_WORKER_POLL_SECONDS:-0.5}
      - ADE_API_AGENT_RUNTIME_V3_LEASE_SECONDS=${ADE_API_AGENT_RUNTIME_V3_LEASE_SECONDS:-60}
      - ADE_API_AGENT_RUNTIME_V3_HEARTBEAT_SECONDS=${ADE_API_AGENT_RUNTIME_V3_HEARTBEAT_SECONDS:-15}
      - ADE_API_AGENT_RUNTIME_V3_WORKER_HEARTBEAT_SECONDS=${ADE_API_AGENT_RUNTIME_V3_WORKER_HEARTBEAT_SECONDS:-5}
      - ADE_API_AGENT_RUNTIME_V3_WORKER_STALE_SECONDS=${ADE_API_AGENT_RUNTIME_V3_WORKER_STALE_SECONDS:-15}
    command: ["python", "-m", "ade_api.features.agent_runtime_v3.worker"]
    depends_on:
      ade-runtime-migrate:
        condition: service_completed_successfully
      model-router:
        condition: service_healthy

  ade-web:
    build:
      context: ./apps/ade-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ADE_WEB_VERSION: ${ADE_WEB_VERSION:-}
        NEXT_PUBLIC_ADE_WEB_BUILD: ${ADE_WEB_BUILD:-}
    restart: unless-stopped
    environment:
      - ADE_API_BASE_URL=http://ade-api:8000
      - ADE_NATIVE_API_BASE_URL=http://ade-native-api:8000
      - ADE_API_ADMIN_KEY=${ADE_API_ADMIN_KEY:?Set ADE_API_ADMIN_KEY in .env}
      - PORT=3000
    ports:
      - "${ADE_WEB_BIND_HOST:-127.0.0.1}:${ADE_WEB_PORT:-3000}:3000"
    depends_on:
      ade-api:
        condition: service_healthy
      ade-native-api:
        condition: service_healthy
