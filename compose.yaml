name: letta-open-ade

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ADE_PG_ADMIN_USER:-ade_admin}
      POSTGRES_PASSWORD: ${ADE_PG_ADMIN_PASSWORD:?Set ADE_PG_ADMIN_PASSWORD in .env}
      POSTGRES_DB: ${ADE_PG_ADMIN_DB:-postgres}
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ADE_PG_ADMIN_USER:-ade_admin} -d ${ADE_PG_ADMIN_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20

  model-router:
    build:
      context: .
      dockerfile: services/model-router/Dockerfile
    restart: unless-stopped
    env_file:
      - ${ADE_ENV_FILE:-.env}
    environment:
      - ADE_REPOSITORY_ROOT=/app
    volumes:
      - ./config:/app/config:ro
      - ./content/model-catalog:/app/content/model-catalog:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # Use a Docker-resolvable alias; Linux containers do not reliably resolve mDNS.
      - "dgx-spark:${DGX_SPARK_HOST:-100.64.35.71}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 --noproxy '*' http://127.0.0.1:8010/v1/health > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 10s

  ade-api:
    build:
      context: .
      dockerfile: services/ade-api/Dockerfile
      args:
        ADE_SOURCE_REVISION: ${ADE_SOURCE_REVISION:-unknown}
        ADE_SOURCE_DIRTY: ${ADE_SOURCE_DIRTY:-true}
        ADE_SOURCE_FINGERPRINT: ${ADE_SOURCE_FINGERPRINT:-unknown}
    restart: unless-stopped
    env_file:
      - ${ADE_ENV_FILE:-.env}
    environment:
      - ADE_REPOSITORY_ROOT=/app
      - ADE_API_AGENT_RUNTIME_ENABLED=true
      - ADE_API_AGENT_RUNTIME_MODE=${ADE_API_AGENT_RUNTIME_MODE:-development}
      - ADE_API_MODEL_ROUTER_BASE_URL=http://model-router:8010
      - ADE_API_DATABASE_URL=postgresql+psycopg://${ADE_PG_APP_USER:-ade_app}:${ADE_PG_APP_PASSWORD:?Set ADE_PG_APP_PASSWORD in .env}@postgres:5432/${ADE_PG_DB:-ade}
      - AGENT_RUNTIME_ACCEPTANCE_API_BASE_URL=http://ade-api:8000
    volumes:
      - ./content:/app/content
      - ./config:/app/config:ro
      - ./data/runtime:/app/data/runtime
      - ./workflows/evals/agent_runtime_acceptance/outputs:/app/workflows/evals/agent_runtime_acceptance/outputs
    ports:
      - "${ADE_API_BIND_HOST:-127.0.0.1}:${ADE_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v2/health', timeout=5).read()"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 10s
    depends_on:
      model-router:
        condition: service_healthy
      ade-runtime-migrate:
        condition: service_completed_successfully
      ade-runtime-worker:
        condition: service_started

  ade-runtime-migrate:
    build:
      context: .
      dockerfile: services/ade-api/Dockerfile
      args:
        ADE_SOURCE_REVISION: ${ADE_SOURCE_REVISION:-unknown}
        ADE_SOURCE_DIRTY: ${ADE_SOURCE_DIRTY:-true}
        ADE_SOURCE_FINGERPRINT: ${ADE_SOURCE_FINGERPRINT:-unknown}
    restart: "no"
    environment:
      - ADE_REPOSITORY_ROOT=/app
      - ADE_DATABASE_ADMIN_URL=postgresql://${ADE_PG_ADMIN_USER:-ade_admin}:${ADE_PG_ADMIN_PASSWORD:?Set ADE_PG_ADMIN_PASSWORD in .env}@postgres:5432/${ADE_PG_ADMIN_DB:-postgres}
      - ADE_DATABASE_MIGRATION_URL=postgresql+psycopg://${ADE_PG_ADMIN_USER:-ade_admin}:${ADE_PG_ADMIN_PASSWORD:?Set ADE_PG_ADMIN_PASSWORD in .env}@postgres:5432/${ADE_PG_DB:-ade}
      - ADE_PG_DB=${ADE_PG_DB:-ade}
      - ADE_PG_OWNER_ROLE=${ADE_PG_OWNER_ROLE:-ade_owner}
      - ADE_PG_APP_USER=${ADE_PG_APP_USER:-ade_app}
      - ADE_PG_APP_PASSWORD=${ADE_PG_APP_PASSWORD:?Set ADE_PG_APP_PASSWORD in .env}
    command:
      - /bin/sh
      - -ec
      - >-
        python -m ade_api.features.agent_runtime.bootstrap &&
        alembic -c services/ade-api/alembic.ini upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  ade-runtime-worker:
    build:
      context: .
      dockerfile: services/ade-api/Dockerfile
      args:
        ADE_SOURCE_REVISION: ${ADE_SOURCE_REVISION:-unknown}
        ADE_SOURCE_DIRTY: ${ADE_SOURCE_DIRTY:-true}
        ADE_SOURCE_FINGERPRINT: ${ADE_SOURCE_FINGERPRINT:-unknown}
    restart: unless-stopped
    stop_grace_period: ${ADE_API_AGENT_RUNTIME_STOP_GRACE_PERIOD:-650s}
    environment:
      - ADE_REPOSITORY_ROOT=/app
      - ADE_API_AGENT_RUNTIME_ENABLED=true
      - ADE_API_AGENT_RUNTIME_MODE=${ADE_API_AGENT_RUNTIME_MODE:-development}
      - ADE_API_DATABASE_URL=postgresql+psycopg://${ADE_PG_APP_USER:-ade_app}:${ADE_PG_APP_PASSWORD:?Set ADE_PG_APP_PASSWORD in .env}@postgres:5432/${ADE_PG_DB:-ade}
      - ADE_API_MODEL_ROUTER_BASE_URL=http://model-router:8010
      - MODEL_ROUTER_API_KEY=${MODEL_ROUTER_API_KEY:-local-router-dev-key}
      - ADE_API_AGENT_RUNTIME_WORKER_ID=${ADE_API_AGENT_RUNTIME_WORKER_ID:-ade-runtime-worker}
      - ADE_API_AGENT_RUNTIME_WORKER_POLL_SECONDS=${ADE_API_AGENT_RUNTIME_WORKER_POLL_SECONDS:-0.5}
      - ADE_API_AGENT_RUNTIME_LEASE_SECONDS=${ADE_API_AGENT_RUNTIME_LEASE_SECONDS:-60}
      - ADE_API_AGENT_RUNTIME_HEARTBEAT_SECONDS=${ADE_API_AGENT_RUNTIME_HEARTBEAT_SECONDS:-15}
      - ADE_API_AGENT_RUNTIME_WORKER_HEARTBEAT_SECONDS=${ADE_API_AGENT_RUNTIME_WORKER_HEARTBEAT_SECONDS:-5}
      - ADE_API_AGENT_RUNTIME_WORKER_STALE_SECONDS=${ADE_API_AGENT_RUNTIME_WORKER_STALE_SECONDS:-15}
    command: ["python", "-m", "ade_api.features.agent_runtime.worker"]
    depends_on:
      ade-runtime-migrate:
        condition: service_completed_successfully
      model-router:
        condition: service_healthy

  ade-web:
    build:
      context: ./apps/ade-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ADE_WEB_VERSION: ${ADE_WEB_VERSION:-}
        NEXT_PUBLIC_ADE_WEB_BUILD: ${ADE_WEB_BUILD:-}
    restart: unless-stopped
    environment:
      - ADE_API_BASE_URL=http://ade-api:8000
      - ADE_API_ADMIN_KEY=${ADE_API_ADMIN_KEY:?Set ADE_API_ADMIN_KEY in .env}
      - PORT=3000
    ports:
      - "${ADE_WEB_BIND_HOST:-127.0.0.1}:${ADE_WEB_PORT:-3000}:3000"
    depends_on:
      ade-api:
        condition: service_healthy
