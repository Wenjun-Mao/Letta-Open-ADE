embeddings_base_url = "http://100.64.35.71:8001/v1"
embeddings_model = "Qwen/Qwen3-Embedding-0.6B"
embedding_dimensions = 1024
embedding_timeout_seconds = 15
retrieval_strategy = "semantic"
