router_v1_base_url = "http://model-router:8010/v1"
ade_api_base_url = "http://127.0.0.1:8000"
output_dir = "workflows/evals/agent_runtime_study/outputs"
fixture_path = "workflows/evals/agent_runtime_study/fixtures/study_cases.json"
models = [
  "dgx_vllm::qwen3.6-35b-a3b-fp8",
  "local_llama_server::gemma4",
]
adapters = ["custom_loop", "pydantic_ai"]
case_keys = []
run_live = false
reviewer_model_key = "dgx_vllm::qwen3.6-35b-a3b-fp8"
