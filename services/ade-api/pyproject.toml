[project]
name = "ade-api"
version = "0.3.0"
description = "First-class HTTP API for Letta Open ADE."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18.4,<2",
    "fastapi>=0.135.2",
    "httpx>=0.28.1",
    "letta-client>=1.12.1,<2",
    "pgvector>=0.4.1,<0.5",
    "psycopg[binary,pool]>=3.3.3,<4",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.50,<3",
    "tenacity>=9.1.2",
    "uvicorn>=0.42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ade_api"]
